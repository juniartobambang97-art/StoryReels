<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>StoryReels</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;
 min-height:100dvh;
}
header{
 height:58px;padding:0 18px;
 display:flex;align-items:center;
 justify-content:space-between;
 border-bottom:1px solid #222;
}
.logo{font-size:21px;font-weight:900;letter-spacing:-1px}
.logo span{color:#e94d79}
button{cursor:pointer;color:white}
.login{
 background:#fff;color:#111;border:0;
 padding:9px 15px;border-radius:20px;font-weight:bold;
}
main{width:100%;max-width:none;margin:auto;padding:0}
.story{
 width:min(100vw,56.25dvh);
 height:min(calc(100dvh - 58px),177.78vw);
 aspect-ratio:9/16;
 margin:auto;
 padding:15px;
 display:flex;flex-direction:column;
 justify-content:space-between;
 overflow:hidden;
 position:relative;
}
.story-top{
 display:flex;justify-content:space-between;
 color:#999;font-size:12px;
}
.stage{
 flex:1;display:flex;align-items:center;
 justify-content:center;text-align:center;
 padding:25px 15px;position:relative;
 overflow:hidden;
}
#sentence{
 font-size:clamp(29px,8vw,43px);
 font-weight:800;line-height:1.35;
 max-width:440px;
 transition:opacity .35s,transform .35s;
}
#sentence.fade{opacity:0;transform:translateY(-25px)}
.play{
 position:absolute;width:64px;height:64px;
 border-radius:50%;border:1px solid #ffffff66;
 background:#ffffff20;backdrop-filter:blur(8px);
 font-size:25px;display:none;
}
.stage.paused .play{display:block}
.progress{
 width:100%;height:4px;accent-color:white;cursor:pointer;
}
.controls{
 display:flex;justify-content:space-between;
 align-items:center;color:#aaa;font-size:12px;
 margin:9px 0 16px;
}
.actions{display:flex;gap:22px;align-items:center;font-size:14px}
.action{background:none;border:0;font-size:22px;padding:5px 0}
.action small{font-size:12px;color:#aaa}
.creator{border-top:1px solid #222;padding-top:14px}
.creator strong{font-size:14px}
.creator p{font-size:13px;color:#aaa;line-height:1.5}
.comment{display:flex;gap:8px;margin-top:12px}
.comment input{
 flex:1;min-width:0;background:#171717;
 border:1px solid #333;border-radius:20px;
 padding:11px 14px;color:white;
}
.comment button{
 border:0;border-radius:20px;
 background:#fff;color:#111;padding:0 15px;
}
footer{text-align:center;color:#555;font-size:11px;padding:10px}
@media(min-width:600px){
 body{min-height:100dvh}
 .story{border:1px solid #292929;border-radius:18px}
}
</style>
</head>
<body>

<header>
 <div class="logo">Story<span>Reels</span></div>
 <button class="login" onclick="alert('Registrasi akan kita hubungkan ke Supabase')">Masuk / Daftar</button>
</header>

<main>
 <section class="story">
  <div class="story-top">
   <span>STORY OF THE DAY</span>
   <span>● CERITA PENDEK</span>
  </div>

  <div class="stage paused" id="stage">
   <div id="sentence">Dunia ini penuh dengan cerita yang belum selesai.</div>
   <button class="play" id="play">▶</button>
  </div>

  <input class="progress" id="progress"
   type="range" min="0" max="100" value="0">

  <div class="controls">
   <span id="time">00:00</span>
   <span>1.0×</span>
   <span id="duration">00:18</span>
  </div>

  <div class="creator">
   <div class="actions">
    <button class="action" id="like">♡ <small id="likes">12</small></button>
    <button class="action" id="love">♥ <small id="loves">8</small></button>
    <button class="action" onclick="document.getElementById('commentBox').focus()">☏ <small>3 komentar</small></button>
    <button class="action" onclick="alert('Fitur bagikan menyusul')">↗</button>
   </div>

   <p><strong>@StoryBot</strong> · Cerita pembuka StoryReels</p>
   <p id="description">Kadang sebuah cerita dimulai dari satu kalimat sederhana.</p>

   <div class="comment">
    <input id="commentBox" placeholder="Tulis komentar...">
    <button onclick="sendComment()">Kirim</button>
   </div>
   <p id="commentResult"></p>
  </div>
 </section>
</main>

<footer>STORYREELS · STORIES YOU READ</footer>

<script>
const sentences=[
 "Dunia ini penuh dengan cerita yang belum selesai.",
 "Ada seseorang yang berjalan sendirian.",
 "Dia tidak tahu ke mana harus pergi.",
 "Namun dia tetap melangkah.",
 "Karena terkadang perjalanan lebih penting daripada tujuan.",
 "Dan cerita itu baru saja dimulai."
];

let index=0;
let playing=false;
let timer=null;
const stage=document.getElementById('stage');
const sentence=document.getElementById('sentence');
const play=document.getElementById('play');
const progress=document.getElementById('progress');
const duration=sentences.length*3;

function showSentence(){
 sentence.classList.add('fade');
 setTimeout(()=>{
  sentence.textContent=sentences[index];
  sentence.classList.remove('fade');
  progress.value=(index/sentences.length)*100;
  document.getElementById('time').textContent=
   '00:'+String(index*3).padStart(2,'0');
 },250);
}

function stop(){
 playing=false;
 clearInterval(timer);
 stage.classList.add('paused');
 play.textContent='▶';
}

function start(){
 if(index>=sentences.length) index=0;
 playing=true;
 stage.classList.remove('paused');
 play.textContent='Ⅱ';
 timer=setInterval(()=>{
  index++;
  if(index>=sentences.length){
   stop();
   index=sentences.length-1;
   return;
  }
  showSentence();
 },3000);
}

play.onclick=()=>playing?stop():start();
stage.onclick=(e)=>{
 if(e.target===stage && playing) stop();
};
document.getElementById('duration').textContent=
 '00:'+String(duration).padStart(2,'0');

progress.oninput=()=>{
 index=Math.min(sentences.length-1,
  Math.floor(progress.value/100*sentences.length));
 showSentence();
 if(playing){stop();start();}
};

function reaction(button,countId){
 const active=button.dataset.active==='yes';
 button.dataset.active=active?'no':'yes';
 button.style.color=active?'white':'#ff477e';
 const count=document.getElementById(countId);
 count.textContent=Number(count.textContent)+(active?-1:1);
}
document.getElementById('like').onclick=()=>reaction(
 document.getElementById('like'),'likes');
document.getElementById('love').onclick=()=>reaction(
 document.getElementById('love'),'loves');

function sendComment(){
 const input=document.getElementById('commentBox');
 if(!input.value.trim())return;
 document.getElementById('commentResult').textContent=
  'Komentar demo: '+input.value;
 input.value='';
}
</script>
</body>
</html>
